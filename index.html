<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PS1 Tropical Bird Paraglider</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-overlay">
    <h1>PARABIRD '96: ISLE FLIGHT</h1>
    <p>Low-Speed Scenic Island Approach</p>
    <div class="controls-hint">
      Move / Drag Mouse to Steer &amp; Pitch &bull; Click/Hold for Thermal Lift &bull; [R] Reset
    </div>
  </div>

  <div id="altitude-hud">
    <span id="alt-val">ALT: 180m</span> | <span id="spd-val">SPD: 24 km/h</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
